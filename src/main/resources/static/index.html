<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SparkFlyShop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="banner-header">
    <img src="banner.jpg" alt="Spark Fly Shop Banner" class="banner-img">
    <div class="banner-subtitle">
        <p>Catálogo Oficial • Conectado a Spring Boot API</p>
    </div>
</header>

<main class="container">
    <section class="form-section">
        <h2>Agregar Nuevo Producto</h2>
        <form id="product-form">
            <input type="text" id="name" placeholder="Nombre del producto" required>
            <input type="text" id="category" placeholder="Categoría (ej. Apparel, Drinkware)" required>
            <input type="text" id="description" placeholder="Descripción del producto" required>
            <input type="number" id="price" placeholder="Precio" step="0.01" min="0.01" required>
            <input type="number" id="stock" placeholder="Stock disponible" min="0" required>
            <input type="text" id="imageUrl" placeholder="URL de la imagen (ej. img/hoodie.jpg)">
            <button type="submit">Guardar Producto</button>
        </form>
        <p id="status-message"></p>
    </section>

    <section class="catalog-section">
        <div class="catalog-header">
            <h2>Productos</h2>
            <div class="filters">
                <button id="btn-all" class="active">Todos</button>
                <button id="btn-available">Solo Disponibles</button>
            </div>
        </div>
        <div id="product-grid" class="product-grid"></div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
